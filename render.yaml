services:
  - type: web
    name: apple-line-notifier
    runtime: python
    plan: free
    region: singapore
    buildCommand: pip install -r requirements.txt
    startCommand: gunicorn app:app --bind 0.0.0.0:$PORT --workers 1 --threads 4 --timeout 60
    healthCheckPath: /healthz
    envVars:
      - key: PYTHON_VERSION
        value: 3.13.7
      - key: LINE_CHANNEL_SECRET
        sync: false
      - key: LINE_CHANNEL_ACCESS_TOKEN
        sync: false
      - key: LINE_USER_ID
        sync: false
      - key: NOTIFY_API_KEY
        sync: false
      - key: GMAIL_ACCOUNT_EMAIL
        sync: false
      - key: GMAIL_CREDENTIALS_JSON
        sync: false
